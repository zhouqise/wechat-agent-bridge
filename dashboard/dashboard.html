<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeChat Agent · 管理面板</title><link rel="stylesheet" href="/dashboard.css"><body><header><div class="eyebrow">WECHAT AGENT BRIDGE · LOCAL CONTROL</div><h1>你的 AI 工作台</h1><p>一个入口，管理每位用户的 Codex 与 Claude Code。</p><span class="badge">仅本机访问</span></header><main><aside><h2>用户</h2><div id="users"></div><button id="refresh">刷新状态</button><p class="hint">新增用户及首次扫码：<br><code>wx-agent user add 名称</code></p></aside><section><div id="message" role="status"></div><h2 id="title">选择用户</h2><pre id="status"></pre><div class="actions"><button id="start">启动服务</button><button id="stop">空闲时停止</button><button id="logs">查看日志</button></div><div class="card"><h2>工作目录</h2><div class="actions"><input id="workspace-path" aria-label="完整工作目录路径" placeholder="已有目录的完整路径" maxlength="1024"><button id="set-workspace">切换工作目录</button></div><p class="hint">可直接输入任意已有、可访问的本机目录，无需提前登记。运行中需等待任务空闲；停止时保存为下次启动目录。不同目录分别保留会话，文件不会移动。</p></div><div class="card"><h2>引擎与配置</h2><div class="actions"><select id="engine" aria-label="引擎"><option value="codex">Codex</option><option value="claude">Claude Code</option></select><button id="set-engine">切换引擎</button><select id="project" aria-label="项目"></select><button id="set-project">切换项目</button></div><div class="actions"><input id="model" aria-label="模型" placeholder="模型 ID / default"><button id="set-model">设置模型</button><button id="models">可用模型</button><select id="notifications" aria-label="通知模式"><option value="quiet">安静通知</option><option value="verbose">完整进度</option></select><button id="set-notifications">保存通知</button></div><p class="hint">配置变更需要任务空闲。账号认证、API 地址与首次安装仍使用 wx-agent setup。</p></div><div class="card"><h2>任务</h2><pre id="tasks">暂无数据</pre></div><div class="card"><h2>会话 <small>当前用户 · 当前项目 · 当前引擎</small></h2><div class="actions"><input id="name" aria-label="新会话名称" placeholder="新会话名称（可选）"><button id="new">新建</button><button id="clear" class="danger">清空并新建</button></div><div id="conversations"></div></div><details><summary>操作结果 / 日志</summary><pre id="output"></pre></details></section></main><script src="/dashboard.js"></script></body></html>
