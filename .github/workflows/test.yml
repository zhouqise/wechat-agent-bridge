name: Cross-platform tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Install real Codex CLI for launcher verification (no login)
        run: npm install -g @openai/codex@0.159.2 --ignore-scripts
      - name: Verify native or npm Codex launcher
        run: node --input-type=module -e "import {codexCommand} from './platform.mjs'; import {execFileSync} from 'node:child_process'; const c=codexCommand(['--version']); console.log(execFileSync(c.file,c.args,{encoding:'utf8',timeout:20000,windowsHide:true}));"
      - name: Install and verify Claude Code launcher (no login)
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.121
          node --input-type=module -e "import {claudeCommand} from './platform.mjs'; import {execFileSync} from 'node:child_process'; const c=claudeCommand(['--version']); console.log(execFileSync(c.file,c.args,{encoding:'utf8',timeout:20000,windowsHide:true}));"
      - name: Verify installable package
        run: |
          npm pack
          npm install -g ./wx-codex-bridge-0.8.0.tgz --ignore-scripts
          wx-agent --version
          wx-agent --help
          if command -v wx-codex; then exit 1; fi
